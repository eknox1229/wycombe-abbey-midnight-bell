<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wycombe Abbey: The Midnight Bell Mystery</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1014;color:#f4ead8;font-family:Georgia,serif;background-image:radial-gradient(circle at 50% 0,#29394355,transparent 45%)}button,input{font:inherit}.wrap{max-width:820px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #5d6870;letter-spacing:.12em;color:#d8b66d}.stats{font-size:.76rem;letter-spacing:0;color:#b6c0c5}.tools{display:flex;gap:8px;margin-top:10px;overflow:auto}.tool{white-space:nowrap;border:1px solid #53616a;background:#172128;color:#f4ead8;border-radius:10px;padding:9px 12px}.card{margin-top:16px;border:1px solid #56636b;border-radius:20px;overflow:hidden;background:#172129;box-shadow:0 18px 60px #000b;animation:rise .45s ease}.hero{height:210px;display:grid;place-items:center;position:relative;background:linear-gradient(#33444d,#10161b)}.hero:after{content:'✦';position:absolute;top:22px;right:25px;color:#d8b66d;animation:twinkle 2s infinite}.art{font-size:5.5rem;filter:drop-shadow(0 8px 10px #0008);animation:float 4s ease-in-out infinite}.scene{padding:24px}.eyebrow{color:#d8b66d;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.scene h1{font-size:2.25rem;line-height:1.04;margin:.35rem 0 1rem}.scene p{font-size:1.05rem;line-height:1.72}.choice{display:block;width:100%;margin:10px 0;padding:15px;border:1px solid #64727a;border-radius:12px;background:#25343d;color:#fff;text-align:left;transition:.15s}.choice:hover{background:#30434e;transform:translateY(-1px)}.choice:active{transform:scale(.985)}.note{padding:14px;border-left:3px solid #d8b66d;background:#10171c;margin:16px 0;border-radius:0 8px 8px 0}.portrait{display:flex;gap:12px;align-items:center;margin:4px 0 16px}.face{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#394953;border:1px solid #77838a;font-size:1.8rem}.who b{display:block}.who span{font-size:.8rem;color:#aeb8bd}.cluepop{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#1e2c34;border:1px solid #d8b66d;border-radius:12px;padding:12px 16px;z-index:5;transition:.35s;box-shadow:0 10px 30px #0009}.cluepop.on{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:10}.modal.hide{display:none}.modalbox{width:min(620px,100%);max-height:85vh;overflow:auto;background:#18242c;border:1px solid #68747b;border-radius:18px;padding:20px}.modalbox h2{margin-top:0;color:#d8b66d}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.room{min-height:76px;padding:10px;border:1px solid #596770;border-radius:10px;background:#111a20;text-align:center;font-size:.8rem;display:grid;place-items:center}.room.active{border-color:#d8b66d;box-shadow:0 0 18px #d8b66d22}.room.wing{grid-column:3}.hint{border:1px solid #786a4b;background:#211d15;padding:13px;border-radius:10px}.small{font-size:.84rem;color:#aeb8bd}.input{width:100%;padding:14px;background:#0c1216;color:white;border:1px solid #718087;border-radius:10px;text-transform:uppercase}.bar{height:4px;background:#2c3940;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#d8b66d;transition:.5s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes twinkle{50%{opacity:.25}}@media(max-width:520px){.scene{padding:20px}.scene h1{font-size:1.9rem}.hero{height:170px}.art{font-size:4.4rem}}
</style></head><body><div class="wrap"><header class="top"><span>WYCOMBE ABBEY</span><span class="stats"><span id="cl">0</span> clues · <span id="it">0</span> items</span></header><nav class="tools"><button class="tool" onclick="notebook()">📓 Notebook</button><button class="tool" onclick="showMap()">🗺️ Abbey Map</button><button class="tool" onclick="hint()">💡 Hint</button><button class="tool" onclick="music()" id="musicBtn">🎵 Music</button></nav><main id="game"></main></div><div id="modal" class="modal hide"><div class="modalbox" id="modalbox"></div></div><div id="pop" class="cluepop">🔎 New clue added</div><script>const S={clues:[],items:[],h:0,scene:'',music:false};const H={'The Photograph':['One of the four names matters more than the others.','Compare the photograph with the torn 1954 record.','The marked name is Clara.'],'The Missing Name':['The photograph and record belong together.','One name is circled twice on the record.','The answer is CLARA.'],'Poppy Sinclair':['The answer has four letters.','Think about the sound that started tonight’s mystery.','The answer is BELL.'],'The Archives':['Someone left a meeting instruction.','Look for a time and a place in the old record.','Meet beneath the bell at 11:45.'],'The Bell Room':['Look for something prepared especially for Isla.','The envelope is fresh even though the room is ancient.','It is addressed to ISLA BEAUMONT.']};function esc(s){return s}function add(a,x){if(!S[a].includes(x)){S[a].push(x);document.getElementById(a==='clues'?'cl':'it').textContent=S[a].length;if(a==='clues')toast(x)}}function toast(x){let p=document.getElementById('pop');p.textContent='🔎 Clue: '+x;p.classList.add('on');setTimeout(()=>p.classList.remove('on'),2600)}function page(title,icon,body,buttons,who=''){S.scene=title;S.h=0;let portrait=who?`<div class="portrait"><div class="face">${who[1]}</div><div class="who"><b>${who[0]}</b><span>${who[2]}</span></div></div>`:'';document.getElementById('game').innerHTML=`<section class="card"><div class="hero"><div class="art">${icon}</div></div><div class="scene"><div class="eyebrow">Chapter I · The Midnight Bell</div><h1>${title}</h1>${portrait}${body}${buttons.map(b=>`<button class="choice" onclick="${b[1]}">${b[0]}</button>`).join('')}</div></section>`;scrollTo({top:0,behavior:'smooth'})}function show(t,x){document.getElementById('modalbox').innerHTML=`<h2>${t}</h2>${x}<button class="choice" onclick="closeM()">Close</button>`;document.getElementById('modal').classList.remove('hide')}function closeM(){document.getElementById('modal').classList.add('hide')}function hint(){let h=H[S.scene];if(!h)return show('💡 Detective hint','There is no dedicated hint for this scene yet. Search the room, talk to people, and follow the newest clue.');S.h=Math.min(S.h+1,3);show('💡 Hint '+S.h,`<div class="hint">${h[S.h-1]}</div><p class="small">Hints become more specific each time you ask.</p>`)}function notebook(){show('📓 Isla’s Detective Notebook',`<h3>Clues</h3>${S.clues.length?'<ul>'+S.clues.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="small">No clues yet.</p>'}<h3>Inventory</h3>${S.items.length?'<ul>'+S.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="small">Nothing collected yet.</p>'}<div class="bar"><i style="width:${Math.min(100,S.clues.length*10)}%"></i></div><p class="small">Investigation progress</p>`)}function showMap(){show('🗺️ Abbey Map',`<p class="small">Rooms you have discovered glow gold.</p><div class="map"><div class="room ${S.scene==='Isla’s Dormitory'?'active':''}">Isla’s Dorm</div><div class="room ${S.scene==='The Library'?'active':''}">Library</div><div class="room ${S.scene==='The Sealed West Wing'?'active':''} wing">West Wing</div><div class="room">Courtyard</div><div class="room">Common Room</div><div class="room">Archives</div><div class="room">Service Passage</div><div class="room">Bell Room</div><div class="room">Bell Tower</div></div>`)}let ac,osc;function music(){S.music=!S.music;document.getElementById('musicBtn').textContent=S.music?'🔇 Music':'🎵 Music';if(!S.music){if(osc)osc.stop();return}try{ac=new AudioContext();osc=ac.createOscillator();let g=ac.createGain();osc.type='sine';osc.frequency.value=110;g.gain.value=.025;osc.connect(g);g.connect(ac.destination);osc.start()}catch(e){}}function start(){room()}function room(){page("Isla’s Dormitory",'🕯️','<p>It is Isla Beaumont’s third night at Wycombe Abbey. Rain whispers against the tall windows.</p><p>Nell is asleep. The corridor beyond the door is dark.</p><p>Then the ancient bell rings from the sealed west wing.</p><div class="note"><b>Once. Twice. Three times.</b></div>',[['Look out the window','windowLook()'],['Search the writing desk','desk()'],['Wake Nell','nell()']])}function windowLook(){add('clues','A light is glowing in the sealed west-wing window');page('The West Wing Window','🌙','<p>Across the courtyard, one upstairs window glows. A silhouette passes behind the curtain.</p><div class="note">The west wing has been closed since 1954.</div>',[['Search the desk','desk()'],['Wake Nell','nell()'],['Go to the courtyard','courtyard()']])}function desk(){add('items','Brass library key');page('The Writing Desk','🔑','<p>Behind Isla’s timetable is a brass key bearing the Abbey crest.</p><div class="note">FOR THE BOOK THAT REMEMBERS.</div>',[['Go to the library','library()'],['Ask Nell about it','nell()']])}function nell(){page('Nell Ashford','👭','<p>“You heard it too, didn’t you?” Nell whispers.</p><p>She tells Isla about Clara Bell, a girl who disappeared in 1954 just before the west wing was sealed.</p>',[['Ask about Clara','nellGirl()'],['Ask about the bell','bellHistory()'],['Go to the library','library()']],['Nell Ashford','👭','Isla’s roommate'])}function nellGirl(){add('clues','A pupil named Clara Bell disappeared in 1954');page('The Missing Girl','📜','<p>“The school records don’t mention her,” Nell says.</p>',[['Go to the library','library()'],['Investigate the courtyard','courtyard()']],['Nell Ashford','👭','Isla’s roommate'])}function bellHistory(){add('clues','The bell has supposedly been silent since 1954');page('The Old Story','🔔','<p>Nell says the bell was removed after Clara disappeared.</p><p>“So why did we hear it tonight?”</p>',[['Go to the library','library()'],['Visit the common room','common()']],['Nell Ashford','👭','Isla’s roommate'])}function library(){page('The Library','📚','<p>The brass key opens a hidden cabinet behind the history shelves.</p><p>Inside: an old photograph, a torn prefect record, and a dust-covered ledger.</p>',[['Examine the photograph','photo()'],['Read the record','record()'],['Search the ledger','archives()']])}function photo(){add('clues','An old photograph shows only three girls though four names are listed');page('The Photograph','📷','<p>Four names are written on the back:</p><div class="note">BEATRICE · ELEANOR · IMOGEN · CLARA</div><p>Only three girls remain visible. One figure has been scratched away.</p>',[['Solve the photograph puzzle','puzzle()'],['Read the record','record()']])}function record(){add('clues','The 1954 record lists Clara');page('The Torn Record','📜','<div class="note">BEATRICE — ELEANOR — IMOGEN — CLARA<br>17 OCTOBER 1954<br>WEST BELL TOWER</div><p>CLARA is circled twice in dark pencil.</p>',[['Examine the photograph','photo()'],['Search the archives','archives()']])}function puzzle(){page('The Missing Name','🧩','<p>Which name belongs to the scratched-out girl?</p><input class="input" id="a" placeholder="TYPE A NAME">',[['Submit answer','check()']])}function check(){let a=(document.getElementById('a').value||'').trim().toLowerCase();if(a==='clara'){add('clues','The scratched-out girl is Clara Bell');add('items','Silver bell charm');page('A Hidden Drawer','🔔','<p>The cabinet clicks open.</p><p>Inside is a silver bell charm engraved <b>C.B.</b></p><div class="note">IF THE BELL RINGS BEFORE MIDNIGHT, DO NOT OPEN THE WEST DOOR.</div>',[['Investigate the courtyard','courtyard()'],['Ask Nell about C.B.','nellCB()']])}else page('Not Quite','🧩','<p>The evidence doesn’t match that answer.</p>',[['Try again','puzzle()']])}function nellCB(){page('C.B.','😶','<p>Nell goes pale. “Clara Bell. My grandmother’s maiden name was Bell.”</p>',[['Ask about her grandmother','grand()'],['Go to the courtyard','courtyard()']],['Nell Ashford','👭','Isla’s roommate'])}function grand(){add('clues','Nell’s grandmother was connected to the Bell family');page('A Family Secret','🕯️','<p>Nell admits her grandmother kept a locked box marked C.B.</p>',[['Search the archives','archives()'],['Go to the courtyard','courtyard()']])}function courtyard(){page('The Courtyard','🌧️','<p>The rain has eased. Something catches the moonlight beside the fountain.</p>',[['Search the fountain','fountain()'],['Watch the west-wing window','watch()'],['Visit the common room','common()']])}function fountain(){add('items','Silver school badge');add('clues','A silver badge bears Clara Bell’s initials');page('The Fountain','🪙','<p>Half-hidden beneath wet leaves is a silver school badge.</p><div class="note">Initials: C.B.</div>',[['Show it to Nell','nellBadge()'],['Take it to the archives','archives()']])}function nellBadge(){page('Nell Recognises It','😶','<p>“That was Clara’s house badge,” Nell says.</p>',[['Ask about Clara’s house','house()'],['Search the archives','archives()']],['Nell Ashford','👭','Isla’s roommate'])}function house(){page('The Old House','🏰','<p>Clara belonged to Bell House, which was dissolved after her disappearance.</p>',[['Search the archives','archives()']])}function watch(){add('clues','A shadow is watching from the west-wing window');page('The Glowing Window','👁️','<p>A shadow appears and raises a hand to the glass.</p><p>The light goes out.</p>',[['Search the archives','archives()'],['Return to the dorm','room()']])}function common(){page('The Common Room','🫖','<p>Three girls are still awake.</p>',[['Talk to Beatrice','beatrice()'],['Talk to Imogen','imogen()'],['Talk to Poppy','poppy()'],['Return to your dorm','room()']])}function beatrice(){add('clues','Beatrice insists the west wing is off-limits');page('Beatrice Pembroke','🎓','<p>“There was no Clara Bell at this school,” she says too quickly.</p><p>Her hand tightens around her teacup.</p>',[['Press her about Clara','pressB()'],['Leave','common()']],['Beatrice Pembroke','🎓','Head Girl'])}function pressB(){add('clues','Beatrice denies Clara existed but seems frightened');page('A Warning','🎓','<p>“Some parts of the Abbey are better left alone,” Beatrice says.</p><p>“Especially the west wing.”</p>',[['Search the archives','archives()'],['Return','common()']],['Beatrice Pembroke','🎓','Head Girl'])}function imogen(){add('clues','Imogen knows secret routes around the Abbey');page('Imogen Hartley','🃏','<p>Imogen gives Isla a knowing smile.</p><p>“There’s a service passage behind the old tapestry. If you’re looking for trouble, that’s where I’d start.”</p>',[['Ask about the passage','passage()'],['Ask what she knows about Clara','imogenClara()'],['Leave','common()']],['Imogen Hartley','🃏','Rule-breaker'])}function imogenClara(){add('clues','Older pupils still whisper about Clara');page('A Rumour','🃏','<p>“They say Clara didn’t disappear,” Imogen says.</p><p>“They say she was locked in the west wing.”</p>',[['Ask about the passage','passage()'],['Leave','common()']],['Imogen Hartley','🃏','Rule-breaker'])}function passage(){add('items','Old service-map scrap');page('The Service Passage','🗺️','<p>Behind the tapestry is a narrow stone passage.</p><div class="note">LIBRARY → SERVICE PASSAGE → BELL ROOM</div><p>The map ends at a room labelled BELL ROOM.</p>',[['Search the archives','archives()'],['Return to the common room','common()']])}function poppy(){page('Poppy Sinclair','✏️','<p>Poppy points to a crossword clue.</p><div class="note"><b>A sound heard at night — 4 letters</b></div><input class="input" id="w" placeholder="TYPE WORD">',[['Solve','word()'],['Ask about old records','archives()']],['Poppy Sinclair','✏️','Crossword enthusiast'])}function word(){let a=(document.getElementById('w').value||'').trim().toLowerCase();if(a==='bell'){add('clues','Poppy confirms the answer BELL');page('A Hidden Word','✏️','<p>Poppy turns the clue over.</p><div class="note"><b>ARCHIVE</b> is written on the back.</div>',[['Search the archives','archives()'],['Return','common()']])}else page('Try Again','✏️','<p>Poppy smiles. “Four letters.”</p>',[['Try again','poppy()']])}function archives(){add('clues','Records about Clara were deliberately removed');page('The Archives','🗃️','<div class="note">CLARA BELL — DO NOT CATALOGUE.</div><p>On the next page, a pencil impression reads:</p><div class="note">MEET ME BENEATH THE BELL AT 11:45.</div>',[['Follow the clue to the west wing','west()'],['Return to the library','library()']])}function west(){add('clues','A hidden route leads into the sealed west wing');page('The Sealed West Wing','🚪','<p>The service route opens into a cold stone corridor.</p><p>At the end is a circular room.</p><p>A bell hangs from the ceiling.</p><div class="note">It is covered in dust.</div><p><b>Yet it is moving.</b></p>',[['Enter the bell room','bellRoom()'],['Leave before anyone sees you','ending()']])}function bellRoom(){add('clues','The ancient bell is moving despite having no visible mechanism');page('The Bell Room','🔔','<p>There is no rope. No mechanism.</p><p>On the floor is a fresh footprint.</p><p>Beside it lies a sealed envelope addressed to:</p><div class="note"><b>ISLA BEAUMONT</b></div>',[['Open the envelope','letter()'],['Leave it','ending()']])}function letter(){add('items','Sealed envelope');add('clues','Someone knew Isla would investigate the bell');page('The Letter','✉️','<div class="note"><b>CLARA WAS NOT THE FIRST GIRL TO DISAPPEAR.</b></div><p>Something moves behind Isla.</p>',[['Turn around','finale()']])}function ending(){page('Chapter I — To Be Continued','🌒','<p>Isla returns to her dormitory before dawn.</p><p>She now knows the Abbey has been hiding Clara Bell for decades.</p><div class="note">Clues collected: '+S.clues.length+' · Items: '+S.items.length+'</div>',[['Replay Chapter 1','location.reload()']])}function finale(){page('Chapter I — The Girl in the Portrait','🌘','<p>Isla turns.</p><p>The corridor is empty.</p><p>But on the wall, written in chalk:</p><div class="note"><b>NEXT: THE GIRL IN THE PORTRAIT.</b></div><p>The mystery has only just begun.</p>',[['Replay Chapter 1','location.reload()']])}page('Wycombe Abbey: The Midnight Bell Mystery','🏫','<p>Chapter I — A photograph, a vanished girl, and a bell that should not be ringing.</p><div class="note">A story of secrets, school rivalries, hidden passages, and one very old mystery.</div>',[['▶ Begin Chapter 1','start()']]);</script></body></html>

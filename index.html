<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wycombe Abbey: The Midnight Bell Mystery</title><style>*{box-sizing:border-box}body{margin:0;background:#090e14;color:#f4ead8;font-family:Georgia,serif}.wrap{max-width:850px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #657078;padding:12px 4px;color:#d8b66d;letter-spacing:.12em}.stats{font-size:.75rem;color:#b7c0c4;letter-spacing:0}.tools{display:flex;gap:7px;overflow:auto;padding:10px 0}.tool,.choice{border:1px solid #69757c;border-radius:12px;background:#1d2b34;color:#fff;padding:12px}.tool{white-space:nowrap}.card{margin-top:8px;border:1px solid #59666e;border-radius:20px;overflow:hidden;background:#17232b;box-shadow:0 18px 60px #000b}.hero{height:310px;background:#111820;position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:'✦';position:absolute;right:20px;top:16px;color:#d8b66d;font-size:25px}.badge{position:absolute;left:16px;bottom:14px;background:#0a1017cc;border:1px solid #d8b66d;padding:8px 11px;border-radius:9px;font-size:.72rem;letter-spacing:.12em;color:#e4cf9f}.scene{padding:24px}.eyebrow{color:#d8b66d;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}.scene h1{font-size:2.25rem;line-height:1.05;margin:.4rem 0 1rem}.scene p{font-size:1.05rem;line-height:1.7}.choice{display:block;width:100%;margin:10px 0;text-align:left;font:inherit;cursor:pointer}.choice:hover{background:#2a3c47}.note{border-left:3px solid #d8b66d;background:#0e161c;padding:14px;margin:16px 0;line-height:1.6}.portrait{display:flex;gap:12px;align-items:center;margin-bottom:16px}.portrait img{width:68px;height:68px;border-radius:50%;border:1px solid #b69b64}.who b{display:block}.who span,.small{font-size:.82rem;color:#aeb8bd}.input{width:100%;padding:14px;border-radius:10px;border:1px solid #718087;background:#0b1217;color:white;text-transform:uppercase}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:9}.hide{display:none}.modalbox{max-width:650px;width:100%;max-height:88vh;overflow:auto;background:#18252d;border:1px solid #6b767c;border-radius:18px;padding:20px}.modalbox h2{color:#d8b66d}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room{min-height:72px;border:1px solid #56646c;background:#101920;border-radius:10px;display:grid;place-items:center;text-align:center;font-size:.8rem}.room.active{border-color:#d8b66d;box-shadow:0 0 18px #d8b66d33}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;background:#1d2b34;border:1px solid #d8b66d;border-radius:12px;padding:12px 16px;transition:.3s;z-index:12}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.hero{height:230px}.scene{padding:20px}.scene h1{font-size:1.9rem}}</style></head><body><div class="wrap"><header class="top"><span>WYCOMBE ABBEY</span><span class="stats"><span id="cl">0</span> clues · <span id="it">0</span> items</span></header><nav class="tools"><button class="tool" onclick="notebook()">📓 Notebook</button><button class="tool" onclick="showMap()">🗺️ Map</button><button class="tool" onclick="hint()">💡 Hint</button></nav><main id="game"></main></div><div id="modal" class="modal hide"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div><script>const S={clues:[],items:[],scene:'',hint:0};const H={"The Photograph":["Compare the names on the photograph with the record.","One name is marked twice.","It is Clara."],"The Missing Name":["The answer is in the 1954 record.","Look at the circled name.","CLARA."],"Poppy Sinclair":["The answer is four letters.","Think of the sound that began tonight.","BELL."],"The Archives":["Find a time and a place.","The note says to meet beneath something.","Meet beneath the bell at 11:45."],"The Bell Room":["The envelope is addressed to someone specific.","Read the name carefully.","ISLA BEAUMONT."]};function add(a,x){if(!S[a].includes(x)){S[a].push(x);document.getElementById(a==='clues'?'cl':'it').textContent=S[a].length;if(a==='clues'){let t=document.getElementById('toast');t.textContent='🔎 '+x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}}}function asset(t){let m={"Wycombe Abbey: The Midnight Bell Mystery":"abbey.svg","Isla’s Dormitory":"dorm.svg","The West Wing Window":"abbey.svg","The Writing Desk":"dorm.svg","The Library":"library.svg","The Photograph":"photo.svg","The Torn Record":"library.svg","A Hidden Drawer":"library.svg","The Courtyard":"courtyard.svg","The Fountain":"courtyard.svg","The Glowing Window":"abbey.svg","The Common Room":"common.svg","The Archives":"archives.svg","The Service Passage":"passage.svg","The Sealed West Wing":"bell.svg","The Bell Room":"bell.svg","The Letter":"bell.svg","Chapter I — The Girl in the Portrait":"bell.svg","Chapter I — To Be Continued":"abbey.svg","The Missing Girl":"photo.svg","The Old Story":"bell.svg","A Family Secret":"dorm.svg","The Old House":"abbey.svg","A Rumour":"passage.svg","A Hidden Word":"common.svg","The Not Quite":"photo.svg"};return 'assets/'+(m[t]||'abbey.svg')}function portrait(who){if(!who)return'';let files={'Nell Ashford':'nell.svg','Beatrice Pembroke':'beatrice.svg','Imogen Hartley':'imogen.svg','Poppy Sinclair':'poppy.svg'};let f=files[who[0]]||'isla.svg';return `<div class="portrait"><img src="assets/${f}" alt="${who[0]}"><div class="who"><b>${who[0]}</b><span>${who[2]}</span></div></div>`}function page(title,body,buttons,who){S.scene=title;S.hint=0;document.getElementById('game').innerHTML=`<section class="card"><div class="hero"><img src="${asset(title)}" alt="Illustrated ${title}"><div class="badge">CHAPTER I · THE MIDNIGHT BELL</div></div><div class="scene"><div class="eyebrow">A Wycombe Abbey mystery</div><h1>${title}</h1>${portrait(who)}${body}${buttons.map(b=>`<button class="choice" onclick="${b[1]}">${b[0]}</button>`).join('')}</div></section>`;scrollTo({top:0,behavior:'smooth'})}function show(t,x){document.getElementById('modalbox').innerHTML=`<h2>${t}</h2>${x}<button class="choice" onclick="closeM()">Close</button>`;document.getElementById('modal').classList.remove('hide')}function closeM(){document.getElementById('modal').classList.add('hide')}function notebook(){show('📓 Isla’s Detective Notebook',`<h3>Clues</h3>${S.clues.length?'<ul>'+S.clues.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p class="small">No clues yet.</p>'}<h3>Inventory</h3>${S.items.length?'<ul>'+S.items.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p class="small">Nothing collected yet.</p>'}`)}function showMap(){show('🗺️ Abbey Map',`<p class="small">Your current location is highlighted.</p><div class="map"><div class="room">Dormitory</div><div class="room">Library</div><div class="room">Courtyard</div><div class="room">Common Room</div><div class="room">Archives</div><div class="room">Service Passage</div><div class="room active">West Wing</div><div class="room">Bell Room</div><div class="room">Bell Tower</div></div>`)}function hint(){let h=H[S.scene];if(!h)return show('💡 Detective Hint','Search the room, talk to people, and follow the newest clue.');S.hint=Math.min(3,S.hint+1);show('💡 Hint '+S.hint,`<div class="note">${h[S.hint-1]}</div><p class="small">Ask again for a stronger hint.</p>`)}function start(){room()}function room(){page('Isla’s Dormitory','<p>It is Isla Beaumont’s third night at Wycombe Abbey. Rain whispers against the tall windows.</p><p>Nell is asleep when the ancient bell rings from the sealed west wing.</p><div class="note"><b>Once. Twice. Three times.</b></div>',[["Look out the window","windowLook()"],["Search the writing desk","desk()"],["Wake Nell","nell()"]])}function windowLook(){add('clues','A light is glowing in the sealed west-wing window');page('The West Wing Window','<p>Across the courtyard, one upstairs window glows. A silhouette passes behind the curtain.</p><div class="note">The west wing has been closed since 1954.</div>',[["Search the desk","desk()"],["Wake Nell","nell()"],["Go to the courtyard","courtyard()"]])}function desk(){add('items','Brass library key');page('The Writing Desk','<p>Behind Isla’s timetable is a brass key bearing the Abbey crest.</p><div class="note">FOR THE BOOK THAT REMEMBERS.</div>',[["Go to the library","library()"],["Ask Nell about it","nell()"]])}function nell(){page('Nell Ashford','<p>“You heard it too, didn’t you?” Nell whispers.</p><p>She tells Isla about Clara Bell, a girl who disappeared in 1954 just before the west wing was sealed.</p>',[["Ask about Clara","nellGirl()"],["Ask about the bell","bellHistory()"],["Go to the library","library()"]],["Nell Ashford","👭","Isla’s roommate"])}function nellGirl(){add('clues','A pupil named Clara Bell disappeared in 1954');page('The Missing Girl','<p>“The school records don’t mention her,” Nell says.</p>',[["Go to the library","library()"],["Investigate the courtyard","courtyard()"]],["Nell Ashford","👭","Isla’s roommate"])}function bellHistory(){add('clues','The bell has supposedly been silent since 1954');page('The Old Story','<p>Nell says the bell was removed after Clara disappeared.</p><p>“So why did we hear it tonight?”</p>',[["Go to the library","library()"],["Visit the common room","common()"]],["Nell Ashford","👭","Isla’s roommate"])}function library(){page('The Library','<p>The brass key opens a hidden cabinet behind the history shelves.</p><p>Inside: an old photograph, a torn prefect record, and a dust-covered ledger.</p>',[["Examine the photograph","photo()"],["Read the record","record()"],["Search the ledger","archives()"]])}function photo(){add('clues','An old photograph shows only three girls though four names are listed');page('The Photograph','<p>Four names are written on the back:</p><div class="note">BEATRICE · ELEANOR · IMOGEN · CLARA</div><p>Only three girls remain visible. One figure has been scratched away.</p>',[["Solve the photograph puzzle","puzzle()"],["Read the record","record()"]])}function record(){add('clues','The 1954 record lists Clara');page('The Torn Record','<div class="note">BEATRICE — ELEANOR — IMOGEN — CLARA<br>17 OCTOBER 1954<br>WEST BELL TOWER</div><p>CLARA is circled twice in dark pencil.</p>',[["Examine the photograph","photo()"],["Search the archives","archives()"]])}function puzzle(){page('The Missing Name','<p>Which name belongs to the scratched-out girl?</p><input class="input" id="a" placeholder="TYPE A NAME">',[["Submit answer","check()"]])}function check(){let a=(document.getElementById('a').value||'').trim().toLowerCase();if(a==='clara'){add('clues','The scratched-out girl is Clara Bell');add('items','Silver bell charm');page('A Hidden Drawer','<p>The cabinet clicks open.</p><p>Inside is a silver bell charm engraved <b>C.B.</b></p><div class="note">IF THE BELL RINGS BEFORE MIDNIGHT, DO NOT OPEN THE WEST DOOR.</div>',[["Investigate the courtyard","courtyard()"],["Ask Nell about C.B.","nellCB()"]])}else page('The Not Quite','<p>The evidence doesn’t match that answer.</p>',[["Try again","puzzle()"]])}function nellCB(){page('C.B.','<p>Nell goes pale. “Clara Bell. My grandmother’s maiden name was Bell.”</p>',[["Ask about her grandmother","grand()"],["Go to the courtyard","courtyard()"]],["Nell Ashford","👭","Isla’s roommate"])}function grand(){add('clues','Nell’s grandmother was connected to the Bell family');page('A Family Secret','<p>Nell admits her grandmother kept a locked box marked C.B.</p>',[["Search the archives","archives()"],["Go to the courtyard","courtyard()"]])}function courtyard(){page('The Courtyard','<p>The rain has eased. Something catches the moonlight beside the fountain.</p>',[["Search the fountain","fountain()"],["Watch the west-wing window","watch()"],["Visit the common room","common()"]])}function fountain(){add('items','Silver school badge');add('clues','A silver badge bears Clara Bell’s initials');page('The Fountain','<p>Half-hidden beneath wet leaves is a silver school badge.</p><div class="note">Initials: C.B.</div>',[["Show it to Nell","nellBadge()"],["Take it to the archives","archives()"]])}function nellBadge(){page('Nell Recognises It','<p>“That was Clara’s house badge,” Nell says.</p>',[["Ask about Clara’s house","house()"],["Search the archives","archives()"]],["Nell Ashford","👭","Isla’s roommate"])}function house(){page('The Old House','<p>Clara belonged to Bell House, which was dissolved after her disappearance.</p>',[["Search the archives","archives()"]])}function watch(){add('clues','A shadow is watching from the west-wing window');page('The Glowing Window','<p>A shadow appears and raises a hand to the glass. The light goes out.</p>',[["Search the archives","archives()"],["Return to the dorm","room()"]])}function common(){page('The Common Room','<p>Three girls are still awake.</p>',[["Talk to Beatrice","beatrice()"],["Talk to Imogen","imogen()"],["Talk to Poppy","poppy()"],["Return to your dorm","room()"]])}function beatrice(){add('clues','Beatrice insists the west wing is off-limits');page('Beatrice Pembroke','<p>“There was no Clara Bell at this school,” she says too quickly.</p><p>Her hand tightens around her teacup.</p>',[["Press her about Clara","pressB()"],["Leave","common()"]],["Beatrice Pembroke","🎓","Head Girl"])}function pressB(){add('clues','Beatrice denies Clara existed but seems frightened');page('A Warning','<p>“Some parts of the Abbey are better left alone,” Beatrice says.</p><p>“Especially the west wing.”</p>',[["Search the archives","archives()"],["Return","common()"]],["Beatrice Pembroke","🎓","Head Girl"])}function imogen(){add('clues','Imogen knows secret routes around the Abbey');page('Imogen Hartley','<p>“There’s a service passage behind the old tapestry. If you’re looking for trouble, that’s where I’d start.”</p>',[["Ask about the passage","passage()"],["Ask what she knows about Clara","imogenClara()"],["Leave","common()"]],["Imogen Hartley","🃏","Rule-breaker"])}function imogenClara(){add('clues','Older pupils still whisper about Clara');page('A Rumour','<p>“They say Clara didn’t disappear,” Imogen says. “They say she was locked in the west wing.”</p>',[["Ask about the passage","passage()"],["Leave","common()"]],["Imogen Hartley","🃏","Rule-breaker"])}function passage(){add('items','Old service-map scrap');page('The Service Passage','<p>Behind the tapestry is a narrow stone passage.</p><div class="note">LIBRARY → SERVICE PASSAGE → BELL ROOM</div>',[["Search the archives","archives()"],["Return to the common room","common()"]])}function poppy(){page('Poppy Sinclair','<p>Poppy points to a crossword clue.</p><div class="note"><b>A sound heard at night — 4 letters</b></div><input class="input" id="w" placeholder="TYPE WORD">',[["Solve","word()"],["Ask about old records","archives()"]],["Poppy Sinclair","✏️","Crossword enthusiast"])}function word(){let a=(document.getElementById('w').value||'').trim().toLowerCase();if(a==='bell'){add('clues','Poppy confirms the answer BELL');page('A Hidden Word','<p>Poppy turns the clue over.</p><div class="note"><b>ARCHIVE</b> is written on the back.</div>',[["Search the archives","archives()"],["Return","common()"]])}else page('Try Again','<p>Poppy smiles. “Four letters.”</p>',[["Try again","poppy()"]])}function archives(){add('clues','Records about Clara were deliberately removed');page('The Archives','<div class="note">CLARA BELL — DO NOT CATALOGUE.</div><p>On the next page, a pencil impression reads:</p><div class="note">MEET ME BENEATH THE BELL AT 11:45.</div>',[["Follow the clue to the west wing","west()"],["Return to the library","library()"]])}function west(){add('clues','A hidden route leads into the sealed west wing');page('The Sealed West Wing','<p>The service route opens into a cold stone corridor.</p><p>At the end is a circular room. A bell hangs from the ceiling.</p><div class="note">It is covered in dust.</div><p><b>Yet it is moving.</b></p>',[["Enter the bell room","bellRoom()"],["Leave before anyone sees you","ending()"]])}function bellRoom(){add('clues','The ancient bell is moving despite having no visible mechanism');page('The Bell Room','<p>There is no rope. No mechanism.</p><p>On the floor is a fresh footprint. Beside it lies a sealed envelope addressed to:</p><div class="note"><b>ISLA BEAUMONT</b></div>',[["Open the envelope","letter()"],["Leave it","ending()"]])}function letter(){add('items','Sealed envelope');add('clues','Someone knew Isla would investigate the bell');page('The Letter','<div class="note"><b>CLARA WAS NOT THE FIRST GIRL TO DISAPPEAR.</b></div><p>Something moves behind Isla.</p>',[["Turn around","finale()"]])}function ending(){page('Chapter I — To Be Continued','<p>Isla returns to her dormitory before dawn.</p><p>She now knows the Abbey has been hiding Clara Bell for decades.</p><div class="note">Clues collected: '+S.clues.length+' · Items: '+S.items.length+'</div>',[["Replay Chapter 1","location.reload()"]])}function finale(){page('Chapter I — The Girl in the Portrait','<p>Isla turns.</p><p>The corridor is empty.</p><p>But on the wall, written in chalk:</p><div class="note"><b>NEXT: THE GIRL IN THE PORTRAIT.</b></div><p>The mystery has only just begun.</p>',[["Replay Chapter 1","location.reload()"]])}page('Wycombe Abbey: The Midnight Bell Mystery','<p>Chapter I — A photograph, a vanished girl, and a bell that should not be ringing.</p><div class="note">A story of secrets, school rivalries, hidden passages, and one very old mystery.</div>',[["▶ Begin Chapter 1","start()"]]);</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wycombe Abbey: The Midnight Bell Mystery</title><style>body{margin:0;background:#10161b;color:#f4ead8;font-family:Georgia,serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{border-bottom:1px solid #59636a;padding:10px 0;color:#d8b66d;letter-spacing:.12em;display:flex;justify-content:space-between}.tools{display:flex;gap:8px;margin-top:10px}.tool{border:1px solid #59636a;background:#19232b;color:#f4ead8;border-radius:9px;padding:8px 11px}.card{margin-top:22px;background:#19232b;border:1px solid #59636a;border-radius:18px;overflow:hidden}.art{height:160px;display:grid;place-items:center;font-size:5rem;background:linear-gradient(#34434c,#12181d)}.scene{padding:24px}.scene h1{font-size:2.35rem;line-height:1}.scene p{font-size:1.06rem;line-height:1.7}.choice{display:block;width:100%;margin:11px 0;padding:15px;border-radius:11px;border:1px solid #65727a;background:#273640;color:white;font:inherit;text-align:left}.note{padding:12px 14px;border-left:3px solid #d8b66d;background:#11191f;margin:15px 0}.hint{padding:14px;border:1px solid #7a6844;border-radius:10px;background:#211d14;margin-top:15px}.gold{color:#d8b66d}.small{font-size:.88rem;color:#adb7bd}input{width:100%;padding:14px;box-sizing:border-box;background:#0d1318;color:white;border:1px solid #738087;border-radius:9px;text-transform:uppercase}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modalbox{max-width:560px;width:100%;background:#19232b;border:1px solid #69747a;border-radius:16px;padding:20px}.hide{display:none}</style></head><body><div class="wrap"><div class="top"><span>WYCOMBE ABBEY</span><span id="count">Clues 0</span></div><div class="tools"><button class="tool" onclick="notebook()">📓 Notebook</button><button class="tool" onclick="hint()">💡 Hint</button></div><div id="game"></div></div><div id="modal" class="modal hide"><div class="modalbox" id="modalbox"></div></div><script>const S={clues:[],items:[],h:0};const H={"The Photograph":["One of the four names is more important than the others.","Look at the old record and find the name that is marked.","The marked name is Clara."],"The Missing Name":["The photograph and record are meant to be read together.","One name is circled twice on the 1954 record.","The answer is Clara."],"Poppy Sinclair":["The answer has four letters.","Think about the sound Isla heard that night.","The answer is BELL."],"The Archives":["The missing girl is connected to the bell.","Look for a meeting place mentioned in the old records.","The note says to meet beneath the bell at 11:45."],"The Bell Room":["Someone prepared this room recently.","Look closely at what was left for Isla.","There is an envelope addressed to Isla Beaumont."]};let current="";function add(a,b){if(!S[a].includes(b))S[a].push(b);if(a==='clues')document.getElementById('count').textContent='Clues '+S.clues.length}function page(t,i,x,bs){current=t;S.h=0;document.getElementById('game').innerHTML='<div class="card"><div class="art">'+i+'</div><div class="scene"><h1>'+t+'</h1>'+x+bs.map(b=>'<button class="choice" onclick="'+b[1]+'">'+b[0]+'</button>').join('')+'</div></div>'}function hint(){let hs=H[current];if(!hs){show('💡 Hint','There is no hint needed here yet. Explore the room and follow the evidence.')}else{S.h=Math.min(S.h+1,3);show('💡 Hint '+S.h,hs[S.h-1]+(S.h===3?'<p class="small">You can close this and try the puzzle.</p>':''))}}function show(t,x){document.getElementById('modalbox').innerHTML='<h2>'+t+'</h2>'+x+'<button class="choice" onclick="closeModal()">Close</button>';document.getElementById('modal').classList.remove('hide')}function closeModal(){document.getElementById('modal').classList.add('hide')}function notebook(){show('📓 Isla’s Detective Notebook','<p><b>Clues discovered:</b></p>'+(S.clues.length?'<ul>'+S.clues.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="small">No clues yet. Start investigating.</p>')+'<p><b>Items:</b></p>'+(S.items.length?'<ul>'+S.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="small">No items yet.</p>'))}function start(){room()}function room(){page("Isla's Dormitory",'🕯️','<p>It is Isla Beaumont’s third night at Wycombe Abbey. Rain taps against the window.</p><p>Then the ancient bell rings from the sealed west wing.</p><p><b>Once. Twice. Three times.</b></p>',[['Look out the window','windowLook()'],['Search the desk','desk()'],['Wake Nell','nell()']])}function windowLook(){add('clues','A light is glowing in the sealed west wing');page('The West Wing Window','🌙','<p>Across the courtyard, one upstairs window glows. A silhouette passes behind the curtain.</p><div class="note">The west wing has been closed since 1954.</div>',[['Search the desk','desk()'],['Wake Nell','nell()'],['Go to the courtyard','courtyard()']])}function desk(){add('items','Brass library key');page('The Writing Desk','🔑','<p>Behind Isla’s timetable is a brass key bearing the Abbey crest.</p><div class="note">FOR THE BOOK THAT REMEMBERS.</div>',[['Go to the library','library()'],['Ask Nell about it','nell()']])}function nell(){page('Nell Ashford','👭','<p>Nell says a girl named Clara Bell disappeared in 1954, just before the west wing was sealed.</p>',[['Ask about Clara','nellGirl()'],['Ask about the bell','bellHistory()'],['Go to the library','library()']])}function nellGirl(){add('clues','A pupil named Clara Bell disappeared in 1954');page('The Missing Girl','📜','<p>“The school records don’t mention her,” Nell whispers.</p>',[['Go to the library','library()'],['Investigate the courtyard','courtyard()']])}function bellHistory(){add('clues','The bell has supposedly been silent since 1954');page('The Old Story','🔔','<p>Nell says the bell was removed after Clara disappeared.</p>',[['Go to the library','library()'],['Visit the common room','common()']])}function library(){page('The Library','📚','<p>The brass key opens a hidden cabinet behind the history shelves.</p><p>Inside is an old photograph and a torn record.</p>',[['Examine the photograph','photo()'],['Read the record','record()']])}function photo(){add('clues','An old photograph shows only three girls though four names are listed');page('The Photograph','📷','<p>BEATRICE · ELEANOR · IMOGEN · CLARA</p><p>Only three girls remain visible. One figure has been scratched away.</p>',[['Solve the puzzle','puzzle()'],['Read the record','record()']])}function record(){add('clues','The 1954 record lists Clara');page('The Torn Record','📜','<div class="note">BEATRICE — ELEANOR — IMOGEN — CLARA<br>17 OCTOBER 1954<br>WEST BELL TOWER</div><p>CLARA is circled twice.</p>',[['Examine the photograph','photo()'],['Search the archives','archives()']])}function puzzle(){page('The Missing Name','🧩','<p>Which name belongs to the scratched-out girl?</p><input id="a" placeholder="TYPE A NAME">',[['Submit answer','check()']])}function check(){if((document.getElementById('a').value||'').trim().toLowerCase()==='clara'){add('clues','The scratched-out girl is Clara Bell');add('items','Silver bell charm');page('A Hidden Drawer','🔔','<p>The cabinet clicks open. Inside is a silver bell charm engraved C.B.</p><div class="note">IF THE BELL RINGS BEFORE MIDNIGHT, DO NOT OPEN THE WEST DOOR.</div>',[['Investigate the courtyard','courtyard()'],['Ask Nell about C.B.','nellCB()']])}else page('Not Quite','🧩','<p>Look again at the circled name.</p>',[['Try again','puzzle()']])}function nellCB(){page('C.B.','😶','<p>Nell goes pale. “Clara Bell. My grandmother’s maiden name was Bell.”</p>',[['Ask about her grandmother','grand()'],['Go to the courtyard','courtyard()']])}function grand(){page('A Family Secret','🕯️','<p>Nell admits her grandmother kept a locked box marked C.B.</p>',[['Search the archives','archives()'],['Go to the courtyard','courtyard()']])}function courtyard(){page('The Courtyard','🌧️','<p>Something catches the moonlight beside the fountain.</p>',[['Search the fountain','fountain()'],['Watch the west window','watch()'],['Visit the common room','common()']])}function fountain(){add('items','Silver school badge');page('The Fountain','🪙','<p>A silver badge lies beneath wet leaves.</p><div class="note">Initials: C.B.</div>',[['Show it to Nell','nellBadge()'],['Take it to the archives','archives()']])}function nellBadge(){page('Nell Recognises It','😶','<p>“That was Clara’s house badge,” Nell says.</p>',[['Ask about Clara’s house','house()'],['Search the archives','archives()']])}function house(){page('The Old House','🏰','<p>Clara belonged to Bell House, dissolved after her disappearance.</p>',[['Search the archives','archives()']])}function watch(){page('The Glowing Window','👁️','<p>A shadow appears and raises a hand to the glass. The light goes out.</p>',[['Search the archives','archives()'],['Return to the dorm','room()']])}function common(){page('The Common Room','🫖','<p>Three girls are awake: Beatrice Pembroke, Imogen Hartley, and Poppy Sinclair.</p>',[['Talk to Beatrice','beatrice()'],['Talk to Imogen','imogen()'],['Talk to Poppy','poppy()'],['Return to dorm','room()']])}function beatrice(){add('clues','Beatrice insists the west wing is off-limits');page('Beatrice Pembroke','🎓','<p>“There was no Clara Bell at this school,” she says too quickly.</p>',[['Press her','pressB()'],['Leave','common()']])}function pressB(){page('A Warning','🎓','<p>Beatrice tells Isla to forget the west wing.</p>',[['Search the archives','archives()'],['Return','common()']])}function imogen(){add('clues','Imogen knows secret routes around the Abbey');page('Imogen Hartley','🃏','<p>Imogen knows of a service passage behind a tapestry.</p>',[['Ask about the passage','passage()'],['Ask about Clara','imogenClara()'],['Leave','common()']])}function imogenClara(){add('clues','Older pupils still whisper about Clara');page('A Rumour','🃏','<p>“They say Clara was locked in the west wing,” Imogen says.</p>',[['Ask about the passage','passage()'],['Leave','common()']])}function passage(){add('items','Old service-map scrap');page('The Service Passage','🗺️','<div class="note">LIBRARY → SERVICE PASSAGE → BELL ROOM</div><p>The map ends at a room labelled BELL ROOM.</p>',[['Search the archives','archives()'],['Return','common()']])}function poppy(){page('Poppy Sinclair','✏️','<p>Crossword clue: <b>A sound heard at night — 4 letters.</b></p><input id="w" placeholder="TYPE WORD">',[['Solve','word()'],['Ask about records','archives()']])}function word(){if((document.getElementById('w').value||'').trim().toLowerCase()==='bell'){add('clues','Poppy confirms the answer BELL');page('A Hidden Word','✏️','<p>Poppy turns the clue over. <b>ARCHIVE</b> is written on the back.</p>',[['Search archives','archives()'],['Return','common()']])}else page('Try Again','✏️','<p>Four letters.</p>',[['Try again','poppy()']])}function archives(){add('clues','Records about Clara were deliberately removed');page('The Archives','🗃️','<div class="note">CLARA BELL — DO NOT CATALOGUE.</div><p>On the next page: “MEET ME BENEATH THE BELL AT 11:45.”</p>',[['Follow the clue','west()'],['Return to library','library()']])}function west(){page('The Sealed West Wing','🚪','<p>A hidden route opens into a cold stone corridor. At the end is a circular room. A bell hangs from the ceiling.</p><p>It is covered in dust.</p><p>Yet it is moving.</p>',[['Enter the bell room','bellRoom()'],['Leave','ending()']])}function bellRoom(){page('The Bell Room','🔔','<p>There is no rope. No visible mechanism.</p><p>On the floor is a fresh footprint.</p><p>Beside it lies an envelope addressed to <b>ISLA BEAUMONT</b>.</p>',[['Open the envelope','letter()'],['Leave','ending()']])}function letter(){add('items','Sealed envelope');page('The Letter','✉️','<div class="note">CLARA WAS NOT THE FIRST GIRL TO DISAPPEAR.</div><p>Something moves behind Isla.</p>',[['Turn around','finale()']])}function ending(){page('Chapter I — To Be Continued','🌘','<p>Isla returns to her dormitory before dawn.</p><p>The Abbey has been hiding Clara Bell for decades.</p><div class="note">Clues: '+S.clues.length+' · Items: '+S.items.length+'</div>',[['Play again','location.reload()']])}function finale(){page('Chapter I — The End','🌘','<p>Isla turns. The corridor is empty.</p><div class="note">NEXT: THE GIRL IN THE PORTRAIT.</div><p>The mystery has only just begun.</p>',[['Play again','location.reload()']])}page('Wycombe Abbey: The Midnight Bell Mystery','🏫','<p>Chapter I — A photograph, a vanished girl, and a bell that should not be ringing.</p>',[['▶ Begin Chapter 1','start()']]);</script></body></html>
